name: CI

# Validate feature branches through pull requests without duplicating push runs.
on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]

jobs:
  # QUALITY JOB (REQUIRED) - Runs the repository's pinned Ruff policy once
  quality:
    name: Quality (Python 3.11)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: 'pyproject.toml'

      - name: Install Ruff
        run: python -m pip install ruff==0.14.6

      - name: Check code formatting (Ruff)
        run: ruff format --check odibi/ tests/

      - name: Check changed MCP formatting (Ruff)
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -o pipefail
          if [[ "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="$(git rev-list --max-parents=0 HEAD)"
          fi
          git cat-file -e "$BASE_SHA^{commit}"
          git diff --name-only -z --diff-filter=ACMR "$BASE_SHA" "$GITHUB_SHA" -- ':(glob)odibi_mcp/**/*.py' \
            | xargs -0 -r ruff format --check

      - name: Lint code (Ruff)
        run: ruff check odibi/ tests/ odibi_mcp/

  # BASE JOB (REQUIRED) - Tests core Pandas functionality
  # This job MUST pass for the build to be considered successful
  test-base:
    name: Test Base (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      # Test on multiple Python versions
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
      # Don't cancel other jobs if one fails
      fail-fast: false

    steps:
      # Step 1: Check out the repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up Python with the specified version
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          # Cache pip dependencies to speed up builds
          cache: 'pip'
          cache-dependency-path: 'pyproject.toml'

      # Step 3: Install base dependencies (including Azure and Spark for Phase 2)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[all,dev]

      # Step 4: Regenerate docs and schema (only on 3.11 where sync test runs)
      - name: Regenerate docs and JSON schema
        if: matrix.python-version == '3.11'
        run: |
          python odibi/introspect.py
          odibi templates schema

      # Step 5: Run all base tests with coverage
      # These are the 78 existing Pandas tests that MUST pass
      - name: Run tests with coverage
        run: pytest -v -m "not extras" --cov=odibi --cov-report=term-missing --cov-report=xml

      # Step 6: Upload coverage report to GitHub (for review)
      - name: Upload coverage report
        uses: codecov/codecov-action@v5
        if: matrix.python-version == '3.11'
        with:
          files: ./coverage.xml
          flags: base
          fail_ci_if_error: false

  # MCP SECURITY JOB (REQUIRED) - Qualifies the installed root wheel and HTTP identity seam
  mcp-security:
    name: MCP Security (Python 3.11)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: 'pyproject.toml'

      - name: Install MCP security dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build 'pytest>=7.4.0'

      - name: Build and install the root wheel with MCP
        run: |
          mkdir -p "$RUNNER_TEMP/odibi-src" "$RUNNER_TEMP/odibi-dist" "$RUNNER_TEMP/mcp-tests"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/odibi-src"
          python -m build --wheel --outdir "$RUNNER_TEMP/odibi-dist" "$RUNNER_TEMP/odibi-src"
          WHEEL="$(find "$RUNNER_TEMP/odibi-dist" -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$WHEEL"
          python -m pip install "${WHEEL}[mcp]"
          python -m pip check
          cp tests/unit/mcp/test_access.py "$RUNNER_TEMP/mcp-tests/"
          cp tests/unit/test_odibi_dispatcher.py "$RUNNER_TEMP/mcp-tests/"
          cp tests/unit/mcp/test_mcp_smoke.py "$RUNNER_TEMP/mcp-tests/"

      - name: Require the FastMCP HTTP request API
        working-directory: ${{ runner.temp }}
        run: |
          python -c "import fastmcp; from fastmcp.server.dependencies import get_http_request"
          python -c "import odibi, odibi_mcp, odibi_mcp.dispatcher, odibi_mcp.mcp_server, odibi_mcp.databricks_app"
          python -c "import os, pathlib, odibi, odibi_mcp; workspace = pathlib.Path(os.environ['GITHUB_WORKSPACE']).resolve(); assert all(workspace not in pathlib.Path(module.__file__).resolve().parents for module in (odibi, odibi_mcp))"

      - name: Run installed-package authorization and HTTP contract tests
        working-directory: ${{ runner.temp }}/mcp-tests
        run: |
          python -m pytest -q \
            test_access.py \
            test_odibi_dispatcher.py \
            test_mcp_smoke.py

  # EXTRAS JOB (OPTIONAL) - Tests optional dependencies (Spark, Azure)
  # This job can fail without breaking the build (experimental features)
  test-extras:
    name: Test Extras (Python 3.11)
    runs-on: ubuntu-latest
    # Enforce pass for hardened CI
    continue-on-error: false

    steps:
      # Step 1: Check out the repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up Python 3.11 (latest stable for extras)
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          # Cache pip dependencies to speed up builds
          cache: 'pip'
          cache-dependency-path: 'pyproject.toml'

      # Step 3: Install Java for Spark
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Step 4: Install with all extras (Spark, Azure, etc.)
      - name: Install with all extras
        run: |
          python -m pip install --upgrade pip
          pip install -e .[all,dev]

      # Step 4: Test that optional imports work correctly
      - name: Test Spark imports
        run: |
          python -c "from odibi.engine.spark_engine import SparkEngine; print('✅ Spark engine imports successfully')"

      # Step 5: Test Azure connection imports
      - name: Test Azure imports
        run: |
          python -c "from odibi.connections.azure_adls import AzureADLS; print('✅ Azure ADLS imports successfully')"
          python -c "from odibi.connections.azure_sql import AzureSQL; print('✅ Azure SQL imports successfully')"

      # Step 6: Run extras-specific tests (marked with @pytest.mark.extras)
      - name: Run extras tests
        run: pytest -v -k "extras" --cov=odibi --cov-report=term-missing

  # SQL JOB (OPTIONAL) - Tests SQL dependencies (Phase 2.5)
  # This job verifies SQL dependencies install correctly
  test-sql:
    name: Test SQL Dependencies (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # This job is allowed to fail without failing the entire build
    continue-on-error: true

    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: 'pyproject.toml'

      # Install with SQL extras
      - name: Install with SQL extras
        run: |
          python -m pip install --upgrade pip
          pip install -e .[sql,dev]

      # Test SQL imports work
      - name: Test SQL imports
        run: |
          python -c "import pyodbc; print(f'pyodbc {pyodbc.version} OK')"
          python -c "import sqlalchemy; print(f'SQLAlchemy {sqlalchemy.__version__} OK')"

      # Test markdown2 and Jinja2 (core deps for Phase 3)
      - name: Test Phase 3 core dependencies
        run: |
          python -c "import markdown2; print(f'markdown2 {markdown2.__version__} OK')"
          python -c "import jinja2; print(f'Jinja2 {jinja2.__version__} OK')"

      # Run full test suite to ensure SQL deps don't break anything
      - name: Run tests
        run: pytest -v

  # BUILD STATUS CHECK - Overall build health indicator
  build-status:
    name: Build Status
    runs-on: ubuntu-latest
    needs: [quality, test-base, mcp-security]
    if: always()
    # Note: test-extras is NOT a dependency, so it won't block this job

    steps:
      - name: All required tests passed
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          BASE_TEST_RESULT: ${{ needs.test-base.result }}
          MCP_SECURITY_RESULT: ${{ needs.mcp-security.result }}
        run: |
          if [[ "$QUALITY_RESULT" != "success" || "$BASE_TEST_RESULT" != "success" || "$MCP_SECURITY_RESULT" != "success" ]]; then
            echo "Required checks failed: quality=$QUALITY_RESULT, base-tests=$BASE_TEST_RESULT, mcp-security=$MCP_SECURITY_RESULT"
            exit 1
          fi
          echo "✅ All required tests passed!"
          echo "🧹 Quality checks: PASSED"
          echo "📊 Base tests: PASSED (78 Pandas tests)"
          echo "🔐 MCP security checks: PASSED"
          echo "🚀 Build is ready for merge"
